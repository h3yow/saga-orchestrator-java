# ============================================================
# Saga Orchestrator 配置
# ============================================================
spring.application.name=saga-orchestrator-java

# ---------- 下游调用韧性配置（超时 / 有界重试 / 熔断） ----------
# 单次下游调用的超时时间（毫秒）。超过后中断执行线程并归类为 RETRYABLE。
saga.resilience.timeout-ms=200
# 最大尝试次数（含首次）。仅对 RETRYABLE（超时/瞬时故障）生效；NON_RETRYABLE 业务失败不重试。
saga.resilience.max-attempts=3
# 重试退避基数（毫秒），指数退避 base * 2^(attempt-1)，封顶为 base 的 10 倍。
saga.resilience.retry-backoff-ms=20
# 同一参与方连续失败达到该阈值后熔断器 OPEN（按参与方维度隔离）。
saga.resilience.failure-threshold=5
# 熔断 OPEN 持续时间（毫秒）；到期后放行一次 HALF_OPEN 探测，成功恢复 CLOSED、失败重新 OPEN。
saga.resilience.open-state-duration-ms=1000

# 日志：编排/参与方/熔断流水在 INFO 级别即可完整观察
logging.level.com.github.h3yow.sagaorchestratorjava=INFO
