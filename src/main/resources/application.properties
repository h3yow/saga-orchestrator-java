# ===== Saga 编排弹性配置 =====
# 单次下游调用的最大尝试次数（含首次）；<=1 表示不重试
saga.resilience.max-attempts=3
# 可重试故障（TIMEOUT/TRANSIENT）两次尝试之间的固定退避（毫秒）
saga.resilience.backoff-millis=50
# 熔断：滚动统计内连续失败达到该次数即开启熔断
saga.resilience.circuit-failure-threshold=3
# 熔断 OPEN 保持时长（毫秒），超时后进入 HALF_OPEN 放一次试探
saga.resilience.circuit-open-millis=2000
# HALF_OPEN 连续成功多少次后回到 CLOSED（自动恢复）
saga.resilience.circuit-success-threshold=1
# 编排侧硬超时：每一次下游调用（单次尝试）允许等待的时间上限（毫秒）；
# 超过即主动停止等待并按可重试瞬时故障 HARD_TIMEOUT 处理，再走重试上限与失败回滚；
# 被掐断调用一律不算成功、不记账。<=0 表示关闭编排侧硬超时（仅保留参与方自报超时）。
saga.resilience.call-timeout-millis=1000
# 硬超时检测派发工作线程数：不同 requestId 的下游调用在独立工作线程上执行，
# 单个下游卡死不阻塞其他请求；需不低于预期混合并发度（默认 64，可扛至少 32 线程混合提交）。
saga.resilience.dispatch-pool-size=64

# 单测/本地演示使用随机端口由测试自行覆盖
spring.main.banner-mode=off
